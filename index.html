<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 安全策略：只允许加载本地资源，防止注入外部脚本 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Ccoding</title>
  <style>
    /* 基础样式：让界面居中、清爽 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f6f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 { font-size: 30px; color: #1f2329; margin-bottom: 8px; }
    .subtitle { color: #646a73; margin-bottom: 28px; }

    button {
      font-size: 16px;
      padding: 10px 36px;
      border: none;
      border-radius: 6px;
      background: #3370ff;
      color: #ffffff;
      cursor: pointer;
    }
    button:hover { background: #245bdb; }

    /* 输出区：模拟终端，黑底绿字 */
    #output {
      margin-top: 28px;
      width: 560px;
      background: #1f2329;
      color: #c8f0a0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      padding: 16px;
      border-radius: 8px;
      white-space: pre-wrap;  /* 保留换行 */
      min-height: 100px;
    }
  </style>
</head>
<body>
  <h1>Ccoding</h1>
  <p class="subtitle">面向 C 语言教学的轻量编程工具 · v0.0.1</p>

  <!-- 运行按钮：点击后触发 renderer.js 里的逻辑 -->
  <button id="run-btn">运行</button>

  <!-- 输出区：显示"编译运行"的结果 -->
  <div id="output">点击上方「运行」按钮，看看会发生什么。</div>

  <!-- 引入渲染进程脚本 -->
  <script src="renderer.js"></script>
</body>
</html>
