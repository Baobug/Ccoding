<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 安全策略：允许本地资源 + Monaco 需要的 blob worker 和 data 字体 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:">
  <title>Ccoding</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      display: flex;
      flex-direction: column;
      background: #f5f6f8;
    }

    /* 顶部工具栏 */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ffffff;
      border-bottom: 1px solid #e5e6eb;
      flex-shrink: 0;
    }

    .logo {
      font-size: 16px;
      font-weight: 500;
      color: #1f2329;
      margin-right: 12px;
    }

    #toolbar button {
      font-size: 14px;
      padding: 6px 16px;
      border: 1px solid #d0d3d9;
      border-radius: 6px;
      background: #ffffff;
      color: #1f2329;
      cursor: pointer;
    }
    #toolbar button:hover { background: #f2f3f5; }

    #toolbar button.primary {
      background: #3370ff;
      border-color: #3370ff;
      color: #ffffff;
    }
    #toolbar button.primary:hover { background: #245bdb; }

    #file-name {
      margin-left: auto;
      font-size: 13px;
      color: #646a73;
    }

    /* 编辑器容器（占据剩余空间） */
    #editor { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <header id="toolbar">
    <span class="logo">Ccoding</span>
    <button id="btn-new">新建</button>
    <button id="btn-open">打开</button>
    <button id="btn-save" class="primary">保存</button>
    <span id="file-name">未命名.c</span>
  </header>

  <!-- Monaco 编辑器挂载点 -->
  <div id="editor"></div>

  <!-- Monaco 编辑器加载器（AMD） -->
  <script src="./node_modules/monaco-editor/min/vs/loader.js"></script>
  <!-- 应用逻辑 -->
  <script src="./renderer.js"></script>
</body>
</html>
